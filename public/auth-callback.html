<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Authentication - Neon CRUD App</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }
        
        .auth-container {
            background: white;
            border-radius: 20px;
            padding: 3rem;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 90%;
        }
        
        .auth-icon {
            font-size: 4rem;
            color: #51cf66;
            margin-bottom: 1rem;
        }
        
        .auth-title {
            color: #333;
            margin-bottom: 1rem;
            font-size: 1.5rem;
        }
        
        .auth-message {
            color: #666;
            margin-bottom: 2rem;
            line-height: 1.6;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .error {
            color: #ff6b6b;
        }
        
        .success {
            color: #51cf66;
        }
    </style>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="auth-container">
        <div id="loading-state">
            <div class="spinner"></div>
            <h2 class="auth-title">Processing Authentication...</h2>
            <p class="auth-message">Please wait while we complete your Google authentication.</p>
        </div>
        
        <div id="success-state" style="display: none;">
            <i class="fas fa-check-circle auth-icon success"></i>
            <h2 class="auth-title">Authentication Successful!</h2>
            <p class="auth-message">You can now close this window and return to the main application to create Google Slides.</p>
        </div>
        
        <div id="error-state" style="display: none;">
            <i class="fas fa-times-circle auth-icon error"></i>
            <h2 class="auth-title">Authentication Failed</h2>
            <p class="auth-message">There was an error during authentication. Please try again.</p>
        </div>
    </div>

    <script>
        // Extract the authorization code from URL
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');
        const error = urlParams.get('error');
        
        if (error) {
            showError();
        } else if (code) {
            handleAuthCallback(code);
        } else {
            showError();
        }
        
        async function handleAuthCallback(code) {
            try {
                const response = await fetch(`/api/slides/auth/callback?code=${encodeURIComponent(code)}`);
                const result = await response.json();
                
                if (result.success) {
                    showSuccess();
                    // Close window after 2 seconds
                    setTimeout(() => {
                        window.close();
                    }, 2000);
                } else {
                    showError();
                }
            } catch (error) {
                console.error('Auth callback error:', error);
                showError();
            }
        }
        
        function showSuccess() {
            document.getElementById('loading-state').style.display = 'none';
            document.getElementById('success-state').style.display = 'block';
        }
        
        function showError() {
            document.getElementById('loading-state').style.display = 'none';
            document.getElementById('error-state').style.display = 'block';
        }
    </script>
</body>
</html>
